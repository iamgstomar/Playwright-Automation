
[pytest]
addopts = -p no:dash -p no:playwright -p no:pytest_playwright --reruns 2 --reruns-delay 3
timeout = 10

markers =
    departments: Departments module (TC-DIC-001 to TC-DIC-069)
    message_template: MessageTemplate module
    login: Login module
    sms_broadcast: SMS Broadcast module
    push_broadcast: Push Broadcast module
    inbox_broadcast: Inbox Broadcast module
    broadcast: Broadcast Inbox/Push/SMS modules
    credit_management: Credit Management module
    credit_reports: CreditReports module
    user_management: User Management module
    reports: Reports module
    home_header: Home-Header module
    general: General CrossCutting module

norecursedirs = tests/generated
